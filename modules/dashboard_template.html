<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Invoice Bot - Team view</title>
<style>
:root {
  --bg: #F2F6F1;
  --surface: #FFFFFF;
  --ink: #17261B;
  --muted: #566A5B;
  --line: #D5E0D4;
  --line-strong: #AEBFAF;
  --band: #0F5B2C;
  --band-ink: #F2F6F1;
  --accent: #12733A;
  --accent-soft: #DDEFE2;
  --bar: #3C9A5F;
  --ok: #0E6B35;      --ok-soft: #D4EBDC;
  --review: #8A5700;  --review-soft: #FBEBC8;
  --fail: #B3261E;    --fail-soft: #FADFDC;
  --skip: #55616F;    --skip-soft: #E6EAF0;
  --info-soft: #DDEFE2;
  --row-hover: #F5F9F4;
  --font: "Bahnschrift", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --radius: 6px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- top band ---------- */
.top { background: var(--band); color: var(--band-ink); }
.top-in { max-width: 1320px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { font-size: 20px; font-weight: 700; letter-spacing: .2px; margin: 0; }
.brand small { font-size: 14px; font-weight: 400; opacity: .7; margin-left: 10px; }
.demo-badge { background: #F0BE62; color: #3A2A00; font-weight: 700; font-size: 13px; padding: 2px 10px; border-radius: 99px; }
.health { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 14px; }
.dot { width: 11px; height: 11px; border-radius: 50%; background: #6FD7A2; flex: none; }
.health.late .dot { background: #FF8F86; }
.health.none .dot { background: #AEBFAF; }
.health b { font-weight: 700; }
.health .sub { opacity: .75; }
.live { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.live .pulse { width: 8px; height: 8px; border-radius: 50%; background: #6FD7A2; flex: none; }
.live.lost { color: #FFB4AC; font-weight: 700; }
.live.lost .pulse { background: #FF8F86; }

main { max-width: 1320px; margin: 0 auto; padding: 18px 20px 48px; }

/* ---------- banners ---------- */
.alerts { display: grid; gap: 10px; margin-bottom: 16px; }
.alert { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius); border: 1px solid; }
.alert .msg { flex: 1; min-width: 0; }
.alert .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; align-self: center; }
.alert .msg strong { display: block; }
.alert ul { margin: 6px 0 0; padding-left: 18px; color: inherit; }
.alert.bad  { background: var(--fail-soft); border-color: var(--fail); color: var(--ink); }
.alert.warn { background: var(--review-soft); border-color: var(--review); color: var(--ink); }
.alert.info { background: var(--info-soft); border-color: var(--accent); color: var(--ink); }
.alert .mark { font-weight: 800; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; color: #fff; font-size: 14px; }
.alert.bad .mark { background: var(--fail); } .alert.warn .mark { background: var(--review); } .alert.info .mark { background: var(--accent); }
.btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--radius); padding: 6px 12px; font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.link { border: 0; background: none; color: var(--accent); padding: 6px 4px; text-decoration: underline; }
.btn[disabled] { opacity: .4; cursor: default; }

/* ---------- period controls ---------- */
.period { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 8px 16px; font-weight: 600; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.nav { display: inline-flex; gap: 6px; }
.nav .btn { padding: 6px 12px; min-width: 40px; font-size: 18px; line-height: 1; }
.plabel { font-size: 22px; font-weight: 700; margin: 0; flex: 1 1 260px; min-width: 0; }
.plabel small { display: inline-block; margin-left: 8px; font-size: 13px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 1px 8px; border-radius: 99px; vertical-align: 3px; }

/* ---------- day strip (the hero) ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.stripbox { padding: 14px 16px 10px; margin-bottom: 14px; }
.stripcap { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; margin-bottom: 8px; }
.stripcap h2 { margin: 0; font-size: 15px; font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); margin-left: auto; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.legend i.gap { background: none; border: 1.5px dashed var(--fail); }
.scroll-x { overflow-x: auto; padding-bottom: 4px; }
.strip { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(22px, 1fr); gap: 3px; height: 150px; min-width: min-content; }
.day { display: flex; flex-direction: column; justify-content: flex-end; border: 0; background: none; padding: 0; min-width: 0; border-radius: 4px; position: relative; color: inherit; }
.day .bars { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 1px; padding: 0 2px; }
.day .b-ok { background: var(--bar); border-radius: 2px 2px 0 0; }
.day .b-att { background: var(--fail); border-radius: 2px 2px 0 0; }
.day .b-ok + .b-att, .day .b-att + .b-ok { border-radius: 0; }
.day .n { text-align: center; font-size: 11px; font-weight: 700; height: 16px; line-height: 16px; }
.day .lbl { text-align: center; font-size: 12px; line-height: 1.15; padding: 3px 0 4px; border-top: 1px solid var(--line); color: var(--ink); }
.day .lbl span { display: block; font-size: 10px; color: var(--muted); }
.day.weekend { background: repeating-linear-gradient(135deg, transparent 0 5px, color-mix(in srgb, var(--line) 55%, transparent) 5px 6px); }
.day.in-range { background: var(--accent-soft); }
.day.in-range .lbl { font-weight: 800; border-top: 3px solid var(--accent); padding-top: 1px; }
.day.today .lbl b { color: var(--accent); }
.day.future { opacity: .35; }
.day.gap .bars::after { content: ""; height: 22px; margin: 0 1px; border: 1.5px dashed var(--fail); border-radius: 3px; }
.day:hover { outline: 1px solid var(--accent); }

/* ---------- tally ---------- */
.tally { padding: 14px 16px 16px; margin-bottom: 14px; }
.tally-top { display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: baseline; }
.big { font-size: 40px; font-weight: 700; line-height: 1; }
.big-cap { font-size: 16px; margin-left: 8px; color: var(--muted); }
.split { display: flex; gap: 18px; margin-left: auto; color: var(--muted); font-size: 14px; flex-wrap: wrap; }
.split b { color: var(--ink); font-size: 16px; margin-right: 5px; }
.tbar { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: var(--skip-soft); margin: 12px 0; }
.tbar span { display: block; height: 100%; }
.t-ok { background: var(--ok); } .t-review { background: var(--review); } .t-failed { background: var(--fail); } .t-skipped { background: var(--skip); }
.tbtns { display: flex; flex-wrap: wrap; gap: 8px; }
.tbtn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--radius); padding: 8px 14px; text-align: left; min-width: 150px; }
.tbtn b { font-size: 20px; display: block; line-height: 1.15; }
.tbtn span { font-size: 13px; color: var(--muted); }
.tbtn[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.tbtn.attn b { color: var(--fail); }
.tbtn.attn.zero b { color: var(--ok); }

/* ---------- filters ---------- */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
.field { position: relative; }
.field input, .field select { height: 40px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); padding: 0 12px; }
.field input { width: min(420px, 100%); padding-left: 34px; }
.field .glass { position: absolute; left: 11px; top: 11px; width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
.field select { padding-right: 8px; max-width: 240px; }
.filters .spacer { flex: 1; }
.count { color: var(--muted); font-size: 14px; margin: 0 2px 8px; }

/* ---------- table ---------- */
.tablebox { overflow: auto; max-height: min(72vh, 960px); }
table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 980px; font-size: 14px; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
thead th { position: sticky; top: 0; background: var(--surface); z-index: 2; border-bottom: 2px solid var(--line-strong); white-space: nowrap; padding: 0; }
thead th button { width: 100%; text-align: inherit; border: 0; background: none; padding: 10px 12px; font-weight: 700; display: flex; gap: 6px; align-items: center; }
thead th.r button { justify-content: flex-end; }
thead th button .arr { color: var(--accent); font-size: 12px; min-width: 10px; }
thead th button:hover { background: var(--row-hover); }
tbody tr.row:hover { background: var(--row-hover); }
td.r, th.r { text-align: right; }
td.nowrap { white-space: nowrap; }
td .sub { display: block; color: var(--muted); font-size: 12.5px; }
td a { color: var(--accent); font-weight: 600; overflow-wrap: anywhere; }
.c-file { min-width: 200px; overflow-wrap: anywhere; }
.c-loc { min-width: 150px; }
.c-notes { min-width: 180px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 8px; border-radius: 99px; font-weight: 700; font-size: 13px; white-space: nowrap; }
.chip i { font-style: normal; font-weight: 800; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.review { background: var(--review-soft); color: var(--review); }
.chip.failed { background: var(--fail-soft); color: var(--fail); }
.chip.skipped { background: var(--skip-soft); color: var(--skip); }
.xbtn { border: 0; background: none; color: var(--muted); width: 26px; height: 26px; border-radius: 4px; padding: 0; transition: transform .12s ease; }
.xbtn[aria-expanded="true"] { transform: rotate(90deg); color: var(--accent); }
.note { max-width: 220px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; color: var(--muted); }
tr.detail td { background: var(--row-hover); padding: 14px 18px 16px 48px; }
.dl { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px 24px; margin: 0; }
.dl dt { color: var(--muted); font-size: 12.5px; }
.dl dd { margin: 0; font-weight: 600; word-break: break-word; }
.dl .wide { grid-column: 1 / -1; }
.pager { display: flex; align-items: center; gap: 10px; justify-content: flex-end; padding: 10px 4px 0; color: var(--muted); font-size: 14px; }

.empty { padding: 44px 20px; text-align: center; }
.empty h3 { margin: 0 0 6px; font-size: 18px; }
.empty p { margin: 0 0 14px; color: var(--muted); }
.empty code { background: var(--skip-soft); padding: 2px 6px; border-radius: 4px; }

/* ---------- bot runs ---------- */
details.runs { margin-top: 18px; padding: 0; }
details.runs summary { padding: 14px 16px; font-weight: 700; cursor: pointer; }
details.runs .tablebox { max-height: 360px; border-top: 1px solid var(--line); }
details.runs table { min-width: 760px; }

@media (max-width: 760px) {
  main { padding: 14px 14px 40px; }
  .top-in { padding: 12px 14px; }
  .health { margin-left: 0; width: 100%; }
  .live { width: 100%; }
  .plabel { font-size: 19px; flex-basis: 100%; order: 3; }
  .big { font-size: 34px; }
  .split { margin-left: 0; }
  .tbtn { flex: 1 1 140px; min-width: 0; }
  .legend { margin-left: 0; }
  .hide-sm { display: none; }
  table { min-width: 700px; }
  .alert { flex-wrap: wrap; }
  .alert .btns { margin-left: 34px; width: 100%; }
  .field { flex: 1 1 100%; }
  .field input, .field select { width: 100%; max-width: none; }
  tr.detail td { padding-left: 14px; }
}
@media (prefers-reduced-motion: reduce) { .xbtn { transition: none; } }
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <h1 class="brand">Invoice Bot<small>Team view</small></h1>
    <span class="demo-badge" id="demo" hidden>Demo data</span>
    <div class="health none" id="health" role="status"></div>
    <div class="live" id="live" role="status" hidden></div>
  </div>
</header>

<main>
  <div class="alerts" id="alerts"></div>

  <div class="period">
    <div class="seg" role="group" aria-label="Time period" id="seg">
      <button type="button" data-view="day">Day</button>
      <button type="button" data-view="week">Week</button>
      <button type="button" data-view="month">Month</button>
      <button type="button" data-view="all">All time</button>
    </div>
    <div class="nav">
      <button type="button" class="btn" id="prev" aria-label="Previous period">&#8249;</button>
      <button type="button" class="btn" id="next" aria-label="Next period">&#8250;</button>
      <button type="button" class="btn" id="today">Today</button>
    </div>
    <h2 class="plabel" id="plabel" aria-live="polite"></h2>
  </div>

  <section class="panel stripbox" aria-label="Files received per day">
    <div class="stripcap">
      <h2 id="stripcap"></h2>
      <div class="legend">
        <span><i style="background:var(--bar)"></i>Files received</span>
        <span><i style="background:var(--fail)"></i>Needs attention</span>
        <span><i class="gap"></i>No files on a weekday</span>
      </div>
    </div>
    <div class="scroll-x"><div class="strip" id="strip"></div></div>
  </section>

  <section class="panel tally" aria-label="Summary for the selected period">
    <div class="tally-top">
      <div><span class="big num" id="big">0</span><span class="big-cap" id="bigcap"></span></div>
      <div class="split" id="split"></div>
    </div>
    <div class="tbar" id="tbar" role="img"></div>
    <div class="tbtns" id="tbtns" role="group" aria-label="Show"></div>
  </section>

  <section class="filters" aria-label="Search and filters">
    <div class="field">
      <svg class="glass" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4.5 4.5"/></svg>
      <label class="visually-hidden" for="q">Search</label>
      <input id="q" type="search" placeholder="Search file, invoice, vendor, PO" autocomplete="off">
    </div>
    <div class="field"><label class="visually-hidden" for="type">Type</label>
      <select id="type"><option value="">All types</option><option value="PO">PO invoices</option><option value="NonPO">Non-PO invoices</option><option value="old">Older records</option></select></div>
    <div class="field"><label class="visually-hidden" for="loc">Location</label>
      <select id="loc"><option value="">All locations</option></select></div>
    <div class="field"><label class="visually-hidden" for="status">Status</label>
      <select id="status">
        <option value="all">All statuses</option><option value="ok">Processed</option><option value="attention">Needs attention</option>
        <option value="review">Needs review</option><option value="failed">Failed</option><option value="skipped">Not a PDF</option></select></div>
    <button type="button" class="btn link" id="clear" hidden>Clear filters</button>
    <span class="spacer"></span>
    <button type="button" class="btn" id="csv">Download this list (CSV)</button>
  </section>
  <p class="count" id="count" aria-live="polite"></p>

  <section class="panel">
    <div class="tablebox" id="tablebox">
      <table>
        <thead><tr id="thead"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div id="empty"></div>
  </section>
  <div class="pager" id="pager"></div>

  <details class="panel runs" id="runsbox">
    <summary>Bot runs</summary>
    <div class="tablebox"><table>
      <thead><tr>
        <th>Started</th><th>Result</th><th>Mode</th><th class="r">Folders read</th><th class="r">PDFs seen</th>
        <th class="r">New</th><th class="r">Failed</th><th class="r">Not PDF</th><th class="r">Folders unreadable</th>
      </tr></thead>
      <tbody id="runs"></tbody>
    </table></div>
  </details>
</main>

<script id="app-data" type="application/json">__DATA__</script>
<script>
(function () {
'use strict';

var DATA, FILES, RUNS, LOCATIONS, NOW, LIVE;   // set by load(); live mode calls load() again with fresh data
var $ = function (id) { return document.getElementById(id); };

/* tiny DOM helper: values are always set as text, never as HTML */
function h(tag, props) {
  var el = document.createElement(tag);
  if (props) Object.keys(props).forEach(function (k) {
    var v = props[k];
    if (v == null || v === false) return;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  });
  for (var i = 2; i < arguments.length; i++) {
    [].concat(arguments[i]).forEach(function (kid) {
      if (kid == null || kid === false) return;
      el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    });
  }
  return el;
}

/* ---------- constants ---------- */
var STATUS = {
  failed:  { label: 'Failed',       glyph: '✕', rank: 0 },
  review:  { label: 'Needs review', glyph: '!',      rank: 1 },
  skipped: { label: 'Not a PDF',    glyph: '–', rank: 2 },
  ok:      { label: 'Processed',    glyph: '✓', rank: 3 }
};
var KIND = { PO: 'PO', NonPO: 'Non-PO' };
var PAGE = 100;
var DAY = 86400000;
var MONTH_RE = /^[A-Za-z]{3,}[\s\-_.]*\d{2,4}$/;

/* ---------- dates (all in the viewer's own timezone) ---------- */
function sod(t) { var d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); }
function addDays(t, n) { var d = new Date(t); d.setDate(d.getDate() + n); return d.getTime(); }
function sow(t) { var d = new Date(sod(t)); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getTime(); }
function som(t) { var d = new Date(sod(t)); d.setDate(1); return d.getTime(); }
function addMonths(t, n) { var d = new Date(t); d.setMonth(d.getMonth() + n); return d.getTime(); }
function daysInMonth(t) { var d = new Date(t); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); }
function iso(t) { var d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function fromIso(s) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]).getTime() : NaN; }

var F = {
  full: new Intl.DateTimeFormat('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }),
  short: new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }),
  shortY: new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }),
  month: new Intl.DateTimeFormat('en-GB', { month: 'long', year: 'numeric' }),
  date: new Intl.DateTimeFormat('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }),
  time: new Intl.DateTimeFormat('en-IN', { hour: 'numeric', minute: '2-digit', hour12: true }),
  wd: new Intl.DateTimeFormat('en-GB', { weekday: 'narrow' }),
  wdLong: new Intl.DateTimeFormat('en-GB', { weekday: 'short' })
};
var WDS = new Intl.DateTimeFormat('en-GB', { weekday: 'short' }), MSH = new Intl.DateTimeFormat('en-GB', { month: 'short' });
function fmtShort(t, withYear) { var d = new Date(t); return WDS.format(d) + ' ' + d.getDate() + ' ' + MSH.format(d) + (withYear ? ' ' + d.getFullYear() : ''); }
function dt(t) { return F.date.format(t) + ', ' + F.time.format(t); }
function ago(ms) {
  var m = Math.round(ms / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  var hrs = Math.floor(m / 60);
  if (hrs < 48) return hrs + ' h ' + (m % 60 ? (m % 60) + ' min ' : '') + 'ago';
  return Math.round(hrs / 24) + ' days ago';
}
function inr(n) { return n == null ? '' : Number(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

/* ---------- prepare data ---------- */
function locationOf(folder) {
  var parts = (folder || '').split('/').filter(Boolean), loc = [], month = '', rest = [];
  for (var i = 0; i < parts.length; i++) {
    if (!month && MONTH_RE.test(parts[i])) { month = parts[i]; rest = parts.slice(i + 1); break; }
    loc.push(parts[i]);
  }
  if (!month) { loc = parts; }
  return { loc: loc.join('/'), month: month, sub: rest.join('/') };
}
function load(d) {
  DATA = d;
  NOW = Date.now();
  FILES = d.files.map(function (f) {
    var t = Date.parse(f.received); if (isNaN(t)) t = 0;
    var l = locationOf(f.folder);

      : (NOW - r.st < 1800000 ? h('span', { class: 'chip skipped', text: 'Running' }) : h('span', { class: 'chip failed' }, h('i', { 'aria-hidden': 'true', text: '✕' }), 'Did not finish'));
    b.append(h('tr', null,
      h('td', { class: 'nowrap', text: dt(r.st) }), h('td', null, res),
      h('td', { text: ({ both: 'PO and Non-PO', po: 'PO only', nonpo: 'Non-PO only' })[r.mode] || r.mode || '' }),
      h('td', { class: 'r num', text: String(r.folders || 0) }), h('td', { class: 'r num', text: String(r.seen || 0) }),
      h('td', { class: 'r num', text: String(r.new || 0) }), h('td', { class: 'r num', text: String(r.failed || 0) }),
      h('td', { class: 'r num', text: String(r.skipped || 0) }), h('td', { class: 'r num', text: String(r.errors || 0) })));
  });
}

/* ---------- csv ---------- */
function csvCell(v) {
  if (v == null) return '';
  var s = String(v);
  if (typeof v === 'string' && /^[=+\-@\t\r]/.test(s)) s = "'" + s;   // stop spreadsheet formula injection
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function downloadCsv(rows) {
  var head = ['Status', 'Received', 'File', 'Type', 'Location', 'Month folder', 'Invoice no.', 'Vendor', 'Plant', 'Invoice date', 'PO numbers', 'Gross amount', 'Net amount', 'Notes', 'Drive link'];
  var lines = [head.map(csvCell).join(',')];
  rows.forEach(function (f) {
    lines.push([STATUS[f.status].label, f.t ? iso(f.t) + ' ' + F.time.format(f.t) : '', f.name, kindText(f), f.loc, f.month, f.invoice_no, f.vendor, f.plant,
      f.invoice_date, f.po, f.gross, f.net, f.notes, f.url].map(csvCell).join(','));
  });
  var blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  var a = h('a', { href: URL.createObjectURL(blob), download: 'invoices-' + state.view + '-' + iso(NOW) + '.csv' });
  document.body.append(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
}

/* ---------- live refresh (only when served by serve_dashboard.py) ---------- */
var conn = { ok: true, at: Date.now(), lastText: null };
var busy = false, timer = null;

function renderLive() {
  var el = $('live'); el.textContent = '';
  if (!LIVE) { el.hidden = true; return; }
  el.hidden = false; el.className = 'live' + (conn.ok ? '' : ' lost');
  el.append(h('span', { class: 'pulse', 'aria-hidden': 'true' }),
    conn.ok ? 'Live. Updated ' + F.time.format(conn.at) : 'Not connected. Data is from ' + F.time.format(conn.at));
}
function fillLocations() {
  var sel = $('loc'); sel.length = 1;
  LOCATIONS.forEach(function (l) { sel.append(h('option', { value: l, text: l })); });
  if (state.loc && LOCATIONS.indexOf(state.loc) < 0) state.loc = '';
  sel.value = state.loc;
}
function renderAll() {
  renderHealth(); renderAlerts(); renderRuns(); renderLive(); fillLocations(); sync(false);
}
function schedule() {
  clearTimeout(timer);
  if (LIVE) timer = setTimeout(refresh, LIVE.every * 1000);
}
function refresh() {
  if (!LIVE || busy) return;
  busy = true;
  var ctl = new AbortController(), giveUp = setTimeout(function () { ctl.abort(); }, 20000);
  fetch(LIVE.url, { cache: 'no-cache', credentials: 'same-origin', signal: ctl.signal })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function (text) {
      conn.ok = true; conn.at = Date.now();
      if (text !== conn.lastText) {                // new data: redraw, keeping filters and open rows
        conn.lastText = text;
        var d = JSON.parse(text); LIVE = d.live || LIVE;
        load(d); renderAll();
      } else { renderLive(); renderAlerts(); }
    })
    .catch(function () { conn.ok = false; renderLive(); renderAlerts(); })
    .then(function () { clearTimeout(giveUp); busy = false; schedule(); });
}
function tick() {                                  // keeps "last run 2 h ago" honest while nothing else changes
  NOW = Date.now(); renderHealth(); renderAlerts();
}

/* ---------- wiring ---------- */
function filtersActive() { return !!(state.q || state.type || state.loc || state.status !== 'all'); }
function clearFilters() { state.q = ''; state.type = ''; state.loc = ''; state.status = 'all'; state.page = 1; sync(true); }
function syncInputs() {
  $('q').value = state.q; $('type').value = state.type; $('loc').value = state.loc; $('status').value = state.status;
  $('clear').hidden = !filtersActive();
}
function sync(full) {
  normAnchor(); saveHash(); syncInputs();
  renderControls(); renderStrip(); renderTally(); renderHead(); renderTable();
}

function init() {
  $('demo').hidden = !DATA.demo;
  fillLocations();
  if (!FILES.some(function (f) { return f.legacy; })) [].forEach.call($('type').options, function (o) { if (o.value === 'old') o.remove(); });
  loadHash();

  [].forEach.call($('seg').children, function (b) {
    b.addEventListener('click', function () {
      var r = range(), base = (NOW >= r[0] && NOW < r[1]) ? NOW : state.anchor;
      state.view = b.dataset.view; state.anchor = base; state.page = 1; sync(true);
    });
  });
  function step(n) {
    if (state.view === 'day') state.anchor = addDays(state.anchor, n);
    else if (state.view === 'week') state.anchor = addDays(state.anchor, 7 * n);
    else if (state.view === 'month') state.anchor = addMonths(state.anchor, n);
    state.page = 1; sync(true);
  }
  $('prev').addEventListener('click', function () { step(-1); });
  $('next').addEventListener('click', function () { step(1); });
  $('today').addEventListener('click', function () { state.anchor = NOW; state.page = 1; sync(true); });

  var timer;
  $('q').addEventListener('input', function (e) {
    clearTimeout(timer);
    timer = setTimeout(function () { state.q = e.target.value.trim(); state.page = 1; sync(false); }, 120);
  });
  $('type').addEventListener('change', function (e) { state.type = e.target.value; state.page = 1; sync(false); });
  $('loc').addEventListener('change', function (e) { state.loc = e.target.value; state.page = 1; sync(false); });
  $('status').addEventListener('change', function (e) { state.status = e.target.value; state.page = 1; sync(false); });
  $('clear').addEventListener('click', clearFilters);
  $('csv').addEventListener('click', function () {
    downloadCsv(sorted(FILES.filter(function (f) { return inPeriod(f) && matchesFilters(f) && statusMatches(f, state.status); })));
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $('q').focus(); }
  });

  renderHealth(); renderAlerts(); renderRuns(); renderLive();
  sync(true);
  setInterval(tick, 30000);
  if (LIVE) {
    document.addEventListener('visibilitychange', function () { if (!document.hidden) { clearTimeout(timer); refresh(); } });
    window.addEventListener('online', function () { clearTimeout(timer); refresh(); });
    schedule();
  }
}
init();
})();
</script>
